# Builds the desktop client for each platform and publishes a GitHub release. Asset names and
# SHA256SUMS.txt match what the in-app updater looks for (apps/desktop/src/updater.rs,
# asset_name and select_release).
#
# To release: push a v<version> tag, or push a release/v<version> branch (the release then
# creates the tag at that commit). The version must match [workspace.package] in Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  # Pull requests that touch packaging build every package as a dry run; only tags publish.
  pull_request:
    paths: [".github/workflows/release.yml", "packaging/**", "tools/xtask/**", "apps/desktop/build.rs"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Tag matches the workspace version
        id: tag
        env:
          TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || (startsWith(github.ref_name, 'release/v') && github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          TAG=${TAG#release/}
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -n "$TAG" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match workspace version $version"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  linux:
    env:
      TAG: ${{ needs.version.outputs.tag }}
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libgtk-4-dev libwebkit2gtk-4.1-dev libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libpipewire-0.3-dev libasound2-dev libxdo-dev libdbus-1-dev libxkbcommon-dev \
            libudev-dev libv4l-dev clang cmake nasm zsync libfuse2 desktop-file-utils
      - name: appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: cargo run --locked -p xtask -- package --format appimage
      - name: Collect
        run: |
          mkdir out
          cp "dist-appimage/dtewcord-$TAG-Linux-X64.AppImage" out/
          cp "dist-appimage/dtewcord-$TAG-Linux-X64.AppImage.zsync" out/ 2>/dev/null || echo "No .zsync; delta updates fall back to full downloads."
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: out/*
          if-no-files-found: error

  windows:
    env:
      TAG: ${{ needs.version.outputs.tag }}
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: cargo run --locked -p xtask -- package
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Compress-Archive -Path dist\* -DestinationPath "out\dtewcord-$env:TAG-Windows-X64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/*
          if-no-files-found: error

  macos:
    env:
      TAG: ${{ needs.version.outputs.tag }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: ARM64
          - runner: macos-15-intel
            arch: X64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      # apple-metal's Swift bridge uses macOS 26 SDK symbols.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: cargo run --locked -p xtask -- package
      - name: Zip
        run: |
          mkdir out
          cd dist
          zip -qry "../out/dtewcord-$TAG-macOS-${{ matrix.arch }}.zip" *
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    env:
      TAG: ${{ needs.version.outputs.tag }}
    needs: [version, linux, windows, macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=packaging/release-notes/$TAG.md
          test -f "$notes" || notes=/dev/null
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            where=--verify-tag
          else
            where="--target $GITHUB_SHA"
          fi
          gh release create "$TAG" assets/* $where --title "DTEW Cord $TAG" --notes-file "$notes"

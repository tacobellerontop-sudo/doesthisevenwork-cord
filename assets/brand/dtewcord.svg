<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>DTEW Cord app icon</title>
  <desc>DTEW Cord plug-bubble mark: a speech bubble asking a question, trailing a power cord and plug. Original artwork; no embedded raster images or fonts.</desc>
  <defs>
    <linearGradient id="dtewcord-plate-gradient" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3EE6C1"/>
      <stop offset="0.5" stop-color="#1A9BD8"/>
      <stop offset="1" stop-color="#1D3A9E"/>
    </linearGradient>
  </defs>
  <rect id="dtewcord-plate" width="1024" height="1024" rx="230" fill="url(#dtewcord-plate-gradient)"/>
  <g transform="translate(8 -30)">
  <rect id="dtewcord-bubble" x="196" y="170" width="632" height="456" rx="200" fill="#FFFFFF"/>
  <path id="dtewcord-cord" d="M 420 590 C 420 690 340 670 306 736" stroke="#FFFFFF" stroke-width="76" stroke-linecap="round" fill="none"/>
  <g id="dtewcord-plug" transform="translate(306 736) rotate(27)" fill="#FFFFFF">
    <rect x="-88" y="-8" width="176" height="118" rx="36"/>
    <rect x="-56" y="96" width="34" height="88" rx="17"/>
    <rect x="22" y="96" width="34" height="88" rx="17"/>
  </g>
  <g id="dtewcord-question">
    <path d="M 444 336 a 68 68 0 1 1 108 55 q -40 24 -40 62 v 6" stroke="#1B86CC" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="512" cy="540" r="36" fill="#1B86CC"/>
  </g>
  </g>
</svg>

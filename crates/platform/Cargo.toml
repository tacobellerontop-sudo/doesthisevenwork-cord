[package]
name = "platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
development-data = []

[dependencies]
client-core.workspace = true
cpal = { version = "=0.18.2", default-features = false }
model.workspace = true
serde_json.workspace = true
tokio.workspace = true
notify-rust = "=4.18.0"
winit.workspace = true
global-hotkey.workspace = true
keyring-core.workspace = true
url.workspace = true
zeroize.workspace = true
getrandom.workspace = true
tempfile = "=3.27.0"
rfd = { version = "=0.17.2", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[lints.rust]
# Native integrations permit unsafe only in their audited OS boundaries.
unsafe_code = "deny"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "=0.7.3"
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = ["UI_Notifications", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
wry.workspace = true
keyring.workspace = true
